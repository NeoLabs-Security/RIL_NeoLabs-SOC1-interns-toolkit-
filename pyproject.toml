[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "neolabs-soc-intern-cli"
version = "0.2.0"
description = "NeoLabs × RIL SOC internship pod access client"
requires-python = ">=3.10"

[project.scripts]
neolabs = "tools.cli:main"

[tool.setuptools]
packages = ["tools"]
