name: Build Week 01 SOC Production Pack

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/week-01/**"
      - "docs/secops-foundations/00-neolabs-applied-secops-field-guide.md"
      - "docs/brand/**"
      - ".github/workflows/build-week-01-production-pack.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab==4.2.5
      - name: Use pinned NeoLabs renderer
        run: |
          cp scripts/build-weekly-publication.py /tmp/neolabs-build-weekly-publication.py
      - name: Build Week 1 launch and SecOps field PDFs
        run: |
          python /tmp/neolabs-build-weekly-publication.py \
            --source docs/week-01/operation-night-watch-launch-pack.md \
            --output publications/00_NeoLabs_SOC_L1_Week_01_Launch_Pack.pdf \
            --track "SOC LEVEL 1" --week "Week 01"
          python /tmp/neolabs-build-weekly-publication.py \
            --source docs/secops-foundations/00-neolabs-applied-secops-field-guide.md \
            --output publications/02_NeoLabs_SOC_L1_SecOps_Field_Guide.pdf \
            --track "SOC LEVEL 1" --week "Field Guide"
          test -s publications/00_NeoLabs_SOC_L1_Week_01_Launch_Pack.pdf
          test -s publications/02_NeoLabs_SOC_L1_SecOps_Field_Guide.pdf
      - name: Commit publications
        run: |
          git config user.name "neolabs-publications-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/00_NeoLabs_SOC_L1_Week_01_Launch_Pack.pdf publications/02_NeoLabs_SOC_L1_SecOps_Field_Guide.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build branded Week 01 SOC production PDFs"
          git push
