name: Validate Wazuh Shell Safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  wazuh-shell-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Wazuh shell invocation, host profile and runtime safety
        run: |
          set -euo pipefail
          bash -n neolabs
          bash -n wazuh-stack/scripts/start.sh
          bash -n wazuh-stack/scripts/recover-runtime.sh
          bash -n wazuh-stack/scripts/stage-vcc-secrets.sh
          python3 - <<'PY'
          from pathlib import Path
          import re

          linux_cli = Path('neolabs').read_text(encoding='utf-8')
          windows_cli = Path('internal/windows/Invoke-NeoLabsCLI.ps1').read_text(encoding='utf-8')
          start = Path('wazuh-stack/scripts/start.sh').read_text(encoding='utf-8')
          recovery = Path('wazuh-stack/scripts/recover-runtime.sh').read_text(encoding='utf-8')
          prepare = Path('wazuh-stack/scripts/ensure-prepared.sh').read_text(encoding='utf-8')
          stage = Path('wazuh-stack/scripts/stage-vcc-secrets.sh').read_text(encoding='utf-8')
          compose = Path('wazuh-stack/docker-compose.yml').read_text(encoding='utf-8')

          required = (
              'bash ./scripts/ensure-prepared.sh',
              'bash ./scripts/configure-dashboard-access.sh "$host_mode"',
              'bash ./scripts/preflight.sh',
              'bash ./scripts/repair-stale-bind-mounts.sh',
              'bash ./scripts/recover-runtime.sh',
              'bash ./scripts/health-check.sh --wait 600',
              'bash ./scripts/configure-index-retention.sh',
              'bash ./scripts/provision-dashboard-objects.sh',
              'bash ./scripts/disk-warning.sh',
          )
          missing = [item for item in required if item not in start]
          if missing:
              raise SystemExit('Wazuh startup contract missing: ' + ', '.join(missing))

          for needle in ('NEOLABS_HOST_MODE=windows', 'NEOLABS_HOST_MODE=linux'):
              if needle not in linux_cli:
                  raise SystemExit('Linux/root CLI host-profile detection missing ' + needle)
          if "'(microsoft|wsl)'" not in linux_cli:
              raise SystemExit('Root Bash CLI must identify WSL as the Windows workstation profile')
          if 'env NEOLABS_HOST_MODE=windows python3 -m tools.cli' not in windows_cli:
              raise SystemExit('Windows neolabs.cmd adapter must export the Windows host profile into WSL')
          if 'host_mode="${NEOLABS_HOST_MODE:-linux}"' not in start or 'export NEOLABS_HOST_MODE="$host_mode"' not in start:
              raise SystemExit('Wazuh direct start must resolve and export one host profile')
          if not (start.index('ensure-prepared.sh') < start.index('configure-dashboard-access.sh') < start.index('preflight.sh')):
              raise SystemExit('Dashboard access profile must be resolved before Wazuh preflight')

          direct = []
          for number, line in enumerate(start.splitlines(), 1):
              stripped = line.strip()
              if re.match(r'^(?:if\s+!\s+)?\./scripts/[A-Za-z0-9_.-]+\.sh(?:\s|$)', stripped):
                  direct.append(f'{number}:{stripped}')
          if direct:
              raise SystemExit('Direct helper execution reintroduced executable-bit dependency: ' + '; '.join(direct))

          if 'local seconds="$1" deadline=$((SECONDS + seconds))' in recovery:
              raise SystemExit('Unsafe same-statement wait variable initialization reintroduced')
          if 'local seconds="$1" deadline\n' not in recovery or 'deadline=$((SECONDS + seconds))' not in recovery:
              raise SystemExit('Indexer wait helper must assign its deadline after the local seconds variable exists')

          # /status is protected and returned HTTP 401 on the live 4.14.7 host.
          # Use the /login readiness surface with curl -f; NeoLabs separately checks
          # authenticated dashboard -> manager API connectivity after Docker health.
          expected_health = '["CMD", "curl", "-k", "-s", "-f", "-o", "/dev/null", "https://localhost:5601/login"]'
          if expected_health not in compose:
              raise SystemExit('Dashboard healthcheck must require a successful Wazuh /login response')
          if 'localhost:5601/status' in compose:
              raise SystemExit('Protected /status must not be used as the anonymous Docker healthcheck')

          if './secrets/vcc:/run/vcc-secrets:ro' in compose:
              raise SystemExit('Direct host-secret bind mount reintroduced collector permission failures')
          if 'vcc_runtime_secrets:/run/vcc-secrets:ro' not in compose:
              raise SystemExit('Collector must mount the staged VCC secret volume read-only')
          if 'bash ./scripts/stage-vcc-secrets.sh' not in prepare:
              raise SystemExit('Wazuh preparation must stage VCC secrets after the collector image exists')
          for needle in ('chmod 0600 "$path"', 'id -u collector', 'id -g collector'):
              if needle not in stage:
                  raise SystemExit('VCC secret staging contract missing: ' + needle)

          if './state:/state' in compose:
              raise SystemExit('Direct host state bind reintroduced collector write-permission failures')
          for needle in (
              'vcc_runtime_state:/runtime-state',
              'VCC_ASSIGNED_POD_PATH: /runtime-state/assigned-pod',
              'VCC_TELEMETRY_CURSOR_PATH: /runtime-state/vcc-telemetry.cursor',
              'VCC_HEALTH_PATH: /runtime-state/collector-health.json',
          ):
              if needle not in compose:
                  raise SystemExit('Collector runtime-state contract missing: ' + needle)
          for needle in (
              'state_volume="${COMPOSE_PROJECT_NAME}_vcc_runtime_state"',
              'cp /state-source/assigned-pod /state-dest/assigned-pod',
              'probe="/runtime-state/.neolabs-state-probe-$$"',
          ):
              if needle not in stage:
                  raise SystemExit('Collector runtime-state staging contract missing: ' + needle)

          if 'if [[ ! -e state/dashboard-api.applied.sha256 ]]; then' not in prepare:
              raise SystemExit('Dashboard API applied fingerprint must be initialized only when absent')

          if 'manager_egress:' not in compose:
              raise SystemExit('Manager outbound egress network is missing')
          manager_block = compose.split('  wazuh.manager:', 1)[1].split('  wazuh.indexer:', 1)[0]
          if '- manager_egress' not in manager_block:
              raise SystemExit('Wazuh manager must join its dedicated egress bridge')
          indexer_block = compose.split('  wazuh.indexer:', 1)[1].split('  wazuh.dashboard:', 1)[0]
          if 'manager_egress' in indexer_block:
              raise SystemExit('Wazuh indexer must remain isolated from manager egress')
          PY
