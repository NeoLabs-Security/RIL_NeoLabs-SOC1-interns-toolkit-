name: Validate SOC runtime recovery

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery syntax and deterministic rules
        run: |
          set -euo pipefail
          for file in \
            wazuh-stack/scripts/ensure-prepared.sh \
            wazuh-stack/scripts/prepare-runtime-images.sh \
            wazuh-stack/scripts/prepare-stack.sh \
            wazuh-stack/scripts/render-runtime-credentials.sh \
            wazuh-stack/scripts/sync-indexer-security.sh \
            wazuh-stack/scripts/repair-certificate-permissions.sh \
            wazuh-stack/scripts/repair-telemetry-volume.sh \
            wazuh-stack/scripts/stage-vcc-secrets.sh \
            wazuh-stack/scripts/repair-stale-bind-mounts.sh \
            wazuh-stack/scripts/verify-dashboard-api.sh \
            wazuh-stack/scripts/configure-dashboard-access.sh \
            wazuh-stack/scripts/start.sh \
            wazuh-stack/scripts/recover-runtime.sh \
            wazuh-stack/scripts/doctor.sh; do
            bash -n "$file"
          done
          python3 -m py_compile wazuh-stack/scripts/validate-local-rules.py
          python3 wazuh-stack/scripts/validate-local-rules.py

      - name: Guard staged self-healing Wazuh startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ensure = Path('wazuh-stack/scripts/ensure-prepared.sh').read_text(encoding='utf-8')
          prepare = Path('wazuh-stack/scripts/prepare-stack.sh').read_text(encoding='utf-8')
          render = Path('wazuh-stack/scripts/render-runtime-credentials.sh').read_text(encoding='utf-8')
          sync = Path('wazuh-stack/scripts/sync-indexer-security.sh').read_text(encoding='utf-8')
          volume = Path('wazuh-stack/scripts/repair-telemetry-volume.sh').read_text(encoding='utf-8')
          stage = Path('wazuh-stack/scripts/stage-vcc-secrets.sh').read_text(encoding='utf-8')
          stale = Path('wazuh-stack/scripts/repair-stale-bind-mounts.sh').read_text(encoding='utf-8')
          api = Path('wazuh-stack/scripts/verify-dashboard-api.sh').read_text(encoding='utf-8')
          images = Path('wazuh-stack/scripts/prepare-runtime-images.sh').read_text(encoding='utf-8')
          certfix = Path('wazuh-stack/scripts/repair-certificate-permissions.sh').read_text(encoding='utf-8')
          start = Path('wazuh-stack/scripts/start.sh').read_text(encoding='utf-8')
          recovery = Path('wazuh-stack/scripts/recover-runtime.sh').read_text(encoding='utf-8')
          compose = Path('wazuh-stack/docker-compose.yml').read_text(encoding='utf-8')
          rules = ET.parse('wazuh-stack/config/rules/neolabs_vcc_rules.xml').getroot()

          certs = (
              'root-ca.pem','root-ca-manager.pem','admin.pem','admin-key.pem',
              'wazuh.indexer.pem','wazuh.indexer-key.pem','wazuh.manager.pem',
              'wazuh.manager-key.pem','wazuh.dashboard.pem','wazuh.dashboard-key.pem',
          )
          for cert in certs:
              if cert not in ensure: raise SystemExit('Central generated-file set missing ' + cert)
              if cert not in certfix: raise SystemExit('Certificate verifier missing ' + cert)
          for item in ('wazuh_dashboard/wazuh.yml','wazuh_dashboard/opensearch_dashboards.yml'):
              if item not in ensure: raise SystemExit('Central generated-file set missing ' + item)
          if '--user 0:0' not in certfix or '--user 1000:1000' not in certfix:
              raise SystemExit('Certificate repair must prove root normalisation and service-UID readability')
          for helper in ('render-runtime-credentials.sh','repair-certificate-permissions.sh','prepare-runtime-images.sh','stage-vcc-secrets.sh','repair-telemetry-volume.sh'):
              if helper not in ensure: raise SystemExit('Central preparation gate missing ' + helper)
          if 'render-runtime-credentials.sh' not in prepare or 'prepare-runtime-images.sh' not in prepare:
              raise SystemExit('Regenerated Wazuh stack must render credentials and prepare runtime images')
          for image in ('wazuh-indexer','wazuh-manager','wazuh-dashboard','vcc.telemetry.collector'):
              if image not in images: raise SystemExit('Image preload missing ' + image)

          for rule in rules.findall('.//rule'):
              for field in rule.findall('field'):
                  if field.attrib.get('type') != 'pcre2':
                      raise SystemExit(f"Rule {rule.attrib.get('id')} field {field.attrib.get('name')} is not PCRE2")
          for rule_id in ('100100','100140'):
              rule = next(r for r in rules.findall('.//rule') if r.attrib.get('id') == rule_id)
              if any(f.attrib.get('type') != 'pcre2' for f in rule.findall('field')):
                  raise SystemExit('Lead intern PCRE2 regression returned in rule ' + rule_id)

          if 'securityadmin.sh' not in sync or 'internal_users.yml' not in sync:
              raise SystemExit('Persistent OpenSearch security synchronization is missing')
          if 'runtime-credentials.desired.sha256' not in render or 'WAZUH_API_PASSWORD' not in render or 'wazuh-wui' not in render:
              raise SystemExit('Runtime credential renderer must synchronize indexer and dashboard API credentials')
          if 'id -u collector' not in volume or 'chown -R' not in volume or '--user 0:0' not in volume:
              raise SystemExit('Telemetry volume repair must derive the unprivileged collector UID and repair only /data')
          for cap in ('--cap-add CHOWN', '--cap-add FOWNER', '--cap-add DAC_OVERRIDE'):
              if cap not in volume:
                  raise SystemExit('Telemetry volume root helper must restore only required filesystem capability: ' + cap)
          if '.neolabs-write-probe-' not in volume or 'unprivileged collector still cannot write /data' not in volume:
              raise SystemExit('Telemetry volume repair must verify write access as the actual unprivileged collector')

          # Private VCC host files are staged instead of relaxing 0700/0600 source
          # permissions, and mutable collector state is isolated from host state/.
          for needle in ('id -u collector','id -g collector','vcc_runtime_secrets','vcc_runtime_state','/state-source/assigned-pod','.neolabs-state-probe-'):
              if needle not in stage:
                  raise SystemExit('Collector staging contract missing ' + needle)
          if './secrets/vcc:/run/vcc-secrets:ro' in compose or './state:/state' in compose:
              raise SystemExit('Collector must not directly bind private host secret/state directories')
          for needle in ('vcc_runtime_secrets:/run/vcc-secrets:ro','vcc_runtime_state:/runtime-state'):
              if needle not in compose:
                  raise SystemExit('Collector runtime volume missing ' + needle)

          if 'docker compose --env-file .env rm -sf' not in stale or 'previous toolkit directory' not in stale:
              raise SystemExit('Stale bind-mount migration is missing')
          if 'security/user/authenticate?raw=true' not in api or 'Authorization: Bearer' not in api:
              raise SystemExit('Dashboard->manager API verifier must prove authenticated Wazuh API access')

          if 'ensure-prepared.sh' not in start or 'validate-local-rules.py' not in start or 'recover-runtime.sh' not in start:
              raise SystemExit('start.sh must use central preparation, rule validation and staged recovery')
          if 'repair-stale-bind-mounts.sh' not in start:
              raise SystemExit('start.sh must migrate stale bind-mount containers before recovery')
          if not (start.index('ensure-prepared.sh') < start.index('validate-local-rules.py') < start.index('repair-stale-bind-mounts.sh') < start.index('recover-runtime.sh')):
              raise SystemExit('Wazuh start order must be preparation -> rule validation -> stale-mount repair -> recovery')

          indexer = recovery.index('Starting the Wazuh indexer first')
          manager = recovery.index('Starting the Wazuh manager independently')
          dashboard = recovery.index('Starting the Wazuh dashboard only after manager/indexer health and credentials are proven')
          if not (indexer < manager < dashboard):
              raise SystemExit('Recovery must prove indexer/security, then manager/API, then dashboard')
          required = {
              'indexer raw reachability before current-password health': 'wait_indexer_reachable' in recovery,
              'persistent indexer security sync': 'sync-indexer-security.sh' in recovery,
              'manager fatal classifier': 'manager_fatal_reason' in recovery,
              'fatal configuration stop': 'Deterministic Wazuh manager configuration failure' in recovery,
              'manager restart': 'restart wazuh.manager' in recovery,
              'manager recreate': '--force-recreate --no-deps wazuh.manager' in recovery,
              'bounded manager config repair': 'docker volume rm "${COMPOSE_PROJECT_NAME}_wazuh_etc"' in recovery,
              'dashboard API verification': 'verify-dashboard-api.sh' in recovery,
              'dashboard recreate': '--force-recreate --no-deps wazuh.dashboard' in recovery,
              'collector permission repair': 'repair-telemetry-volume.sh' in recovery,
              'collector recreate': '--force-recreate --no-deps vcc.telemetry.collector' in recovery,
              'diagnostics': 'state/runtime-diagnostics/wazuh-runtime-' in recovery,
              'manager API health': 'wazuh-apid is running' in compose,
              'dashboard login readiness': 'https://localhost:5601/login' in compose,
              'isolated core network retained': 'wazuh_internal:\n    internal: true' in compose,
              'separate dashboard access network': 'dashboard_access:' in compose,
              'manager content-feed egress': 'manager_egress:' in compose,
          }
          missing = [k for k,v in required.items() if not v]
          if missing: raise SystemExit('Wazuh recovery contract incomplete: ' + ', '.join(missing))

          volume_rm_lines = [line.strip() for line in recovery.splitlines() if 'docker volume rm' in line]
          if volume_rm_lines != ['docker volume rm "${COMPOSE_PROJECT_NAME}_wazuh_etc" >/dev/null 2>&1 || true']:
              raise SystemExit('Automatic recovery may delete only the manager configuration volume')
          protected = ('wazuh-indexer-data','vcc_telemetry','secrets/vcc','state/enrolment.json')
          for text in (recovery, volume, stage, stale, sync):
              for destructive in ('docker system prune','rm -rf /var/lib/docker','docker volume rm "${COMPOSE_PROJECT_NAME}_wazuh-indexer-data"'):
                  if destructive in text:
                      raise SystemExit('Protected runtime recovery became destructive: ' + destructive)
          if any(p in '\n'.join(volume_rm_lines) for p in protected):
              raise SystemExit('Protected state must never be deleted')
          PY
