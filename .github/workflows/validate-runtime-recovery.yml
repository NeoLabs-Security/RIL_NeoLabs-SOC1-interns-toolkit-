name: Validate SOC runtime recovery

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery syntax and deterministic rules
        run: |
          set -euo pipefail
          for file in \
            wazuh-stack/scripts/ensure-prepared.sh \
            wazuh-stack/scripts/prepare-runtime-images.sh \
            wazuh-stack/scripts/prepare-stack.sh \
            wazuh-stack/scripts/repair-certificate-permissions.sh \
            wazuh-stack/scripts/start.sh \
            wazuh-stack/scripts/recover-runtime.sh; do
            bash -n "$file"
          done
          python3 -m py_compile wazuh-stack/scripts/validate-local-rules.py
          python3 wazuh-stack/scripts/validate-local-rules.py

      - name: Guard staged self-healing Wazuh startup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ensure = Path('wazuh-stack/scripts/ensure-prepared.sh').read_text(encoding='utf-8')
          prepare = Path('wazuh-stack/scripts/prepare-stack.sh').read_text(encoding='utf-8')
          images = Path('wazuh-stack/scripts/prepare-runtime-images.sh').read_text(encoding='utf-8')
          certfix = Path('wazuh-stack/scripts/repair-certificate-permissions.sh').read_text(encoding='utf-8')
          start = Path('wazuh-stack/scripts/start.sh').read_text(encoding='utf-8')
          recovery = Path('wazuh-stack/scripts/recover-runtime.sh').read_text(encoding='utf-8')
          compose = Path('wazuh-stack/docker-compose.yml').read_text(encoding='utf-8')

          certs = (
              'root-ca.pem','root-ca-manager.pem','admin.pem','admin-key.pem',
              'wazuh.indexer.pem','wazuh.indexer-key.pem','wazuh.manager.pem',
              'wazuh.manager-key.pem','wazuh.dashboard.pem','wazuh.dashboard-key.pem',
          )
          for cert in certs:
              if cert not in ensure: raise SystemExit('Central generated-file set missing ' + cert)
              if cert not in certfix: raise SystemExit('Certificate verifier missing ' + cert)
          if '--user 0:0' not in certfix or '--user 1000:1000' not in certfix:
              raise SystemExit('Certificate repair must prove root normalisation and service-UID readability')
          if 'repair-certificate-permissions.sh' not in ensure or 'prepare-runtime-images.sh' not in ensure:
              raise SystemExit('Central preparation gate must own TLS repair and image preload')
          if 'prepare-runtime-images.sh' not in prepare:
              raise SystemExit('A regenerated Wazuh stack must finish runtime image preparation')
          for image in ('wazuh-indexer','wazuh-manager','wazuh-dashboard','vcc.telemetry.collector'):
              if image not in images: raise SystemExit('Image preload missing ' + image)

          if 'ensure-prepared.sh' not in start or 'validate-local-rules.py' not in start or 'recover-runtime.sh' not in start:
              raise SystemExit('start.sh must use central preparation, rule validation and staged recovery')
          if not (start.index('ensure-prepared.sh') < start.index('validate-local-rules.py') < start.index('recover-runtime.sh')):
              raise SystemExit('Wazuh start order must be preparation -> rule validation -> recovery')

          indexer = recovery.index('Starting the Wazuh indexer first')
          manager = recovery.index('Starting the Wazuh manager independently')
          dashboard = recovery.index('Starting the Wazuh dashboard only after manager and indexer health is proven')
          if not (indexer < manager < dashboard):
              raise SystemExit('Recovery must prove indexer, then manager, then dashboard')
          required = {
              'manager fatal classifier': 'manager_fatal_reason' in recovery,
              'fatal configuration stop': 'Deterministic Wazuh manager configuration failure' in recovery,
              'manager restart': 'restart wazuh.manager' in recovery,
              'manager recreate': '--force-recreate --no-deps wazuh.manager' in recovery,
              'bounded manager config repair': 'docker volume rm "${COMPOSE_PROJECT_NAME}_wazuh_etc"' in recovery,
              'dashboard recreate': '--force-recreate --no-deps wazuh.dashboard' in recovery,
              'collector recreate': '--force-recreate --no-deps vcc.telemetry.collector' in recovery,
              'diagnostics': 'state/runtime-diagnostics/wazuh-runtime-' in recovery,
              'strict dashboard HTTP health': 'curl -skf https://localhost:5601/status' in compose,
          }
          missing = [k for k,v in required.items() if not v]
          if missing: raise SystemExit('Wazuh recovery contract incomplete: ' + ', '.join(missing))

          volume_rm_lines = [line.strip() for line in recovery.splitlines() if 'docker volume rm' in line]
          if volume_rm_lines != ['docker volume rm "${COMPOSE_PROJECT_NAME}_wazuh_etc" >/dev/null 2>&1 || true']:
              raise SystemExit('Automatic recovery may delete only the manager configuration volume')
          for protected in ('wazuh-indexer-data','vcc_telemetry','secrets/vcc','state/enrolment.json'):
              if any(protected in line for line in volume_rm_lines):
                  raise SystemExit('Protected state must never be deleted: ' + protected)
          PY
