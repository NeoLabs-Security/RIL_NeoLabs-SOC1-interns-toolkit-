name: Validate Windows Docker runtime correlation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Guard live-cohort Docker readiness regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          launcher = Path('START-NEOLABS-SOC.cmd').read_text(encoding='utf-8')
          authority = Path('internal/windows/Ensure-NeoLabsRuntime.ps1').read_text(encoding='utf-8')
          runtime_test = Path('internal/windows/Test-NeoLabsDockerRuntime.ps1').read_text(encoding='utf-8')
          repair = Path('internal/windows/Repair-NeoLabsRuntime.ps1').read_text(encoding='utf-8')
          backend = Path('internal/windows/Recover-DockerDesktopBackend.ps1').read_text(encoding='utf-8')

          if 'Ensure-NeoLabsRuntime.ps1' not in launcher:
              raise SystemExit('Windows root launcher must use the single runtime authority')
          for child in ('Test-NeoLabsDockerRuntime.ps1','Repair-NeoLabsRuntime.ps1','Recover-DockerDesktopBackend.ps1'):
              if child in launcher:
                  raise SystemExit('Windows root launcher must not directly orchestrate child helper: ' + child)
              if child not in authority:
                  raise SystemExit('Windows runtime authority must own child helper: ' + child)
          if authority.index('Test-RuntimeReady') > authority.index('primary non-destructive AutoFix'):
              raise SystemExit('Windows runtime must positively test readiness before repair escalation')
          if 'Ensure-WslSocPrerequisites' not in authority or 'vm.max_map_count=262144' not in authority:
              raise SystemExit('Windows authority must prepare WSL userland/kernel prerequisites')

          runtime_requirements = {
              'desktop-linux context': 'context inspect desktop-linux' in runtime_test,
              'formatted host probe': "info --format '{{.OSType}}'" in runtime_test,
              'full info fallback parser': 'FullInfo' in runtime_test,
              'default WSL positive probe': 'Get-DockerWslOsType' in runtime_test,
          }
          missing = [name for name, ok in runtime_requirements.items() if not ok]
          if missing: raise SystemExit('Windows positive runtime test incomplete: ' + ', '.join(missing))

          repair_requirements = {
              'independent server version fallback': "@('version', '--format', '{{.Server.Os}}')" in repair,
              'context refresh': 'Resolve-NeoLabsDockerContext' in repair,
              'final grace': 'final grace probe' in repair,
              'WSL integration repair': 'Set-DockerWslIntegration' in repair,
          }
          missing = [name for name, ok in repair_requirements.items() if not ok]
          if missing: raise SystemExit('Primary Windows AutoFix incomplete: ' + ', '.join(missing))

          backend_requirements = {
              'per-user WSL2 recognition': 'per-user-wsl2' in backend,
              'context refresh': 'Resolve-DockerContext' in backend,
              'least disruptive restart': 'least-disruptive recovery mechanism' in backend,
              'late healthy acceptance': 'became healthy while diagnostics were being written' in backend,
          }
          missing = [name for name, ok in backend_requirements.items() if not ok]
          if missing: raise SystemExit('Deep Windows recovery incomplete: ' + ', '.join(missing))

          for name, text in [('repair', repair), ('backend', backend)]:
              if re.search(r'(?m)^\s*\$args\s*=', text):
                  raise SystemExit(f'{name} must not assign to PowerShell automatic variable $args')
              if re.search(r'(?m)^\s*(?:try\s*\{\s*)?&\s*\$script:DockerCli\s+desktop\s+diagnose\b', text):
                  raise SystemExit(f'{name} must not automatically run a long Docker support archive')
              for item in ('--unregister docker-desktop','--unregister docker-desktop-data','factory reset','docker system prune','Remove-Item -Recurse'):
                  if item.lower() in text.lower():
                      raise SystemExit('Windows runtime recovery must remain non-destructive: ' + item)
          PY

  windows-powershell-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse and self-test Windows runtime helpers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'internal/windows/Ensure-NeoLabsRuntime.ps1',
            'internal/windows/Test-NeoLabsDockerRuntime.ps1',
            'internal/windows/Repair-NeoLabsRuntime.ps1',
            'internal/windows/Recover-DockerDesktopBackend.ps1',
            'internal/windows/Start-NeoLabsSOC.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; throw "PowerShell parser rejected $file" }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File internal/windows/Ensure-NeoLabsRuntime.ps1 -ValidateOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File internal/windows/Start-NeoLabsSOC.ps1 -ValidateOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
