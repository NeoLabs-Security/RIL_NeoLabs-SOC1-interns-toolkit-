name: Validate NeoLabs CLI entrypoints

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-cli-entrypoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify clean-checkout Python entry paths and Linux AutoFix contract
        run: |
          python3 -m tools.cli --help >/dev/null
          python3 tools/cli.py --help >/dev/null
          bash -n ./start-neolabs-soc.sh
          bash -n ./internal/linux/Repair-NeoLabsRuntime.sh
          bash ./internal/linux/Repair-NeoLabsRuntime.sh --validate-only
          bash ./start-neolabs-soc.sh --validate-only

          repair_text="$(cat ./internal/linux/Repair-NeoLabsRuntime.sh)"
          launcher_text="$(cat ./start-neolabs-soc.sh)"
          grep -q 'dpkg --configure -a' <<<"$repair_text" || { echo 'Linux AutoFix must repair interrupted package configuration.' >&2; exit 1; }
          grep -q 'systemctl restart docker' <<<"$repair_text" || { echo 'Linux AutoFix must include Docker service restart recovery.' >&2; exit 1; }
          grep -q 'docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin' <<<"$repair_text" || { echo 'Linux AutoFix must install the complete Docker Engine/Compose toolchain.' >&2; exit 1; }
          grep -q 'save_diagnostics' <<<"$repair_text" || { echo 'Linux AutoFix must save diagnostics when bounded recovery fails.' >&2; exit 1; }
          grep -q 'Repair-NeoLabsRuntime.sh' <<<"$launcher_text" || { echo 'Root Linux launcher must run AutoFix before the SOC workflow.' >&2; exit 1; }

          # Windows interns sometimes enter the Linux launcher from inside WSL.
          # That path must use the Windows WSL root bridge rather than prompting
          # them for a separate Linux sudo password.
          grep -q 'WSL_DISTRO_NAME' <<<"$launcher_text" || { echo 'WSL-aware launcher detection is missing.' >&2; exit 1; }
          grep -q 'wsl.exe --distribution' <<<"$launcher_text" || { echo 'WSL root bridge is missing; Windows interns could be prompted for sudo.' >&2; exit 1; }
          grep -q 'no Linux sudo password required' <<<"$launcher_text" || { echo 'WSL no-sudo AutoFix contract is missing.' >&2; exit 1; }

          # An interrupted Wazuh preparation must be repaired before session/login
          # checks, so large image pulls cannot occur after authentication starts.
          for required in root-ca.pem wazuh.indexer.pem wazuh.manager.pem wazuh.dashboard.pem internal_users.yml; do
            grep -q "$required" <<<"$launcher_text" || { echo "Linux launcher atomic Wazuh check is missing: $required" >&2; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          text = Path('start-neolabs-soc.sh').read_text(encoding='utf-8')
          prepare = text.index('Preparing the pinned Wazuh stack before NeoLabs login/connect')
          session = text.index('Checking your saved NeoLabs session')
          connect = text.index('Connecting authorised VCC telemetry and starting Wazuh')
          if not (prepare < session < connect):
              raise SystemExit('Wazuh preparation/downloads must happen before session validation and connect')
          PY

  windows-cli-invocation-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows launcher contracts from real-machine regressions
        shell: powershell
        run: |
          $socPath = '.\internal\windows\Start-NeoLabsSOC.ps1'
          $dockerPath = '.\internal\windows\Start-NeoLabsDocker.ps1'
          $repairPath = '.\internal\windows\Repair-NeoLabsRuntime.ps1'
          $cmdPath = '.\START-NEOLABS-SOC.cmd'
          $socText = Get-Content $socPath -Raw
          $dockerText = Get-Content $dockerPath -Raw
          $repairText = Get-Content $repairPath -Raw
          $cmdText = Get-Content $cmdPath -Raw

          if ($socText -notmatch 'python3\s+-m\s+tools\.cli') { throw 'Windows launcher must invoke python3 -m tools.cli.' }
          if ($socText -match 'python3\s+tools[/\\]cli\.py') { throw 'Windows launcher must not invoke tools/cli.py directly.' }
          if ($socText -notmatch "Require-RepoFile 'tools\\__init__\.py'") { throw 'Windows launcher must verify the tools package marker.' }

          # Root AutoFix is authoritative. A second Docker bootstrap in the SOC
          # layer can tear down a runtime that AutoFix just made healthy.
          if ($socText -match 'Start-NeoLabsDocker\.ps1') { throw 'SOC layer must not run the legacy Docker bootstrap after root AutoFix.' }
          if ($socText -notmatch 'Assert-DockerStillAvailable') { throw 'SOC layer must verify Docker remained reachable after AutoFix.' }

          # Windows must proactively detect the same interrupted Wazuh preparation
          # that caused the missing root-ca.pem failure on Linux/WSL interns.
          foreach ($required in @('root-ca\.pem','wazuh\.indexer\.pem','wazuh\.manager\.pem','wazuh\.dashboard\.pem','internal_users\.yml')) {
            if ($socText -notmatch $required) { throw "Windows Wazuh atomic preparation check is missing: $required" }
          }

          # Keep the older bootstrap parseable for mentor/compatibility use, even
          # though normal student startup no longer invokes it twice.
          if ($dockerText -notmatch 'desktop-linux') { throw 'Docker helper must retain Linux context support.' }
          if ($dockerText -notmatch 'Wait-WslDocker') { throw 'Docker helper must retain WSL verification.' }

          # Real-machine regression guards: current WSL + old Docker Desktop can
          # create a broken user-distro proxy; and Desktop may be healthy on
          # Windows while the selected WSL distro is not explicitly integrated.
          if ($repairText -notmatch "MinimumDockerDesktopVersion\s*=\s*\[version\]'4\.83\.0'") { throw 'Windows AutoFix must require Docker Desktop 4.83.0+.' }
          foreach ($required in @('settings-store\.json','enableIntegrationWithDefaultWslDistro','integratedWslDistros','Set-DockerWslIntegration','SelfTest')) {
            if ($repairText -notmatch $required) { throw "Windows WSL integration repair contract is missing: $required" }
          }
          if ($repairText -notmatch 'desktop\s+update') { throw 'Windows AutoFix must include Docker Desktop update recovery.' }
          if ($repairText -notmatch 'wsl\.exe\s+--update') { throw 'Windows AutoFix must retain bounded WSL update recovery.' }
          if ($repairText -notmatch 'Diagnostic') { throw 'Windows AutoFix must save useful diagnostics on bounded failure.' }

          $repairIndex = $cmdText.IndexOf('Repair-NeoLabsRuntime.ps1')
          $startIndex = $cmdText.IndexOf('Start-NeoLabsSOC.ps1')
          if ($repairIndex -lt 0 -or $startIndex -lt 0 -or $repairIndex -gt $startIndex) { throw 'Root CMD must reference AutoFix before the SOC launcher.' }

      - name: Validate Windows PowerShell parsers and self-tests
        shell: powershell
        run: |
          foreach ($path in @('.\internal\windows\Start-NeoLabsSOC.ps1', '.\internal\windows\Start-NeoLabsDocker.ps1', '.\internal\windows\Repair-NeoLabsRuntime.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($parseError in $errors) {
                Write-Error ("{0}:{1}:{2}: {3}" -f $path, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message)
              }
              exit 1
            }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\internal\windows\Repair-NeoLabsRuntime.ps1 -ValidateOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c START-NEOLABS-SOC.cmd -ValidateOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
