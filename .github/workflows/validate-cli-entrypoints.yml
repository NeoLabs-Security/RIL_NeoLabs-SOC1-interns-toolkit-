name: Validate NeoLabs CLI entrypoints

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-cli-entrypoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify clean-checkout Python entry paths and Linux AutoFix contract
        run: |
          python3 -m tools.cli --help >/dev/null
          python3 tools/cli.py --help >/dev/null
          bash -n ./start-neolabs-soc.sh
          bash -n ./internal/linux/Repair-NeoLabsRuntime.sh
          bash ./internal/linux/Repair-NeoLabsRuntime.sh --validate-only
          bash ./start-neolabs-soc.sh --validate-only

          repair_text="$(cat ./internal/linux/Repair-NeoLabsRuntime.sh)"
          launcher_text="$(cat ./start-neolabs-soc.sh)"
          grep -q 'dpkg --configure -a' <<<"$repair_text" || { echo 'Linux AutoFix must repair interrupted package configuration.' >&2; exit 1; }
          grep -q 'systemctl restart docker' <<<"$repair_text" || { echo 'Linux AutoFix must include Docker service restart recovery.' >&2; exit 1; }
          grep -q 'docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin' <<<"$repair_text" || { echo 'Linux AutoFix must install the complete Docker Engine/Compose toolchain.' >&2; exit 1; }
          grep -q 'save_diagnostics' <<<"$repair_text" || { echo 'Linux AutoFix must save diagnostics when bounded recovery fails.' >&2; exit 1; }
          grep -q 'Repair-NeoLabsRuntime.sh' <<<"$launcher_text" || { echo 'Root Linux launcher must run AutoFix before the SOC workflow.' >&2; exit 1; }

  windows-cli-invocation-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows launcher contracts
        shell: powershell
        run: |
          $socPath = '.\internal\windows\Start-NeoLabsSOC.ps1'
          $dockerPath = '.\internal\windows\Start-NeoLabsDocker.ps1'
          $repairPath = '.\internal\windows\Repair-NeoLabsRuntime.ps1'
          $cmdPath = '.\START-NEOLABS-SOC.cmd'
          $socText = Get-Content $socPath -Raw
          $dockerText = Get-Content $dockerPath -Raw
          $repairText = Get-Content $repairPath -Raw
          $cmdText = Get-Content $cmdPath -Raw

          if ($socText -notmatch 'python3\s+-m\s+tools\.cli') {
            throw 'Windows launcher must invoke the NeoLabs CLI as: python3 -m tools.cli'
          }
          if ($socText -match 'python3\s+tools[/\\]cli\.py') {
            throw 'Windows launcher must not invoke tools/cli.py directly.'
          }
          if ($socText -notmatch "Require-RepoFile 'tools\\__init__\.py'") {
            throw 'Windows launcher must verify the tools package marker exists.'
          }
          if ($dockerText -notmatch "desktop status") {
            throw 'Docker bootstrap must check Docker Desktop status.'
          }
          if ($dockerText -notmatch "desktop-linux") {
            throw 'Docker bootstrap must prefer the Docker Desktop Linux context.'
          }
          if ($dockerText -notmatch "DOCKER_CONTEXT") {
            throw 'Docker bootstrap must scope the Docker Desktop context to the NeoLabs process.'
          }
          if ($dockerText -notmatch "Wait-WslDocker") {
            throw 'Docker bootstrap must verify Docker from inside the selected WSL2 distro.'
          }
          if ($repairText -notmatch 'wsl\.exe\s+--update') {
            throw 'Windows AutoFix must be able to update WSL automatically.'
          }
          if ($repairText -notmatch 'desktop\s+update') {
            throw 'Windows AutoFix must include a bounded Docker Desktop update recovery path.'
          }
          if ($repairText -notmatch 'Save-RuntimeDiagnostics') {
            throw 'Windows AutoFix must save local diagnostics when bounded recovery fails.'
          }
          if ($repairText -notmatch 'MinimumWslVersion') {
            throw 'Windows AutoFix must enforce the Docker-supported minimum WSL runtime.'
          }
          if ($cmdText -notmatch 'Repair-NeoLabsRuntime\.ps1') {
            throw 'Root Windows launcher must run AutoFix before the SOC launcher.'
          }

      - name: Validate Windows PowerShell parsers and root contract
        shell: powershell
        run: |
          foreach ($path in @('.\internal\windows\Start-NeoLabsSOC.ps1', '.\internal\windows\Start-NeoLabsDocker.ps1', '.\internal\windows\Repair-NeoLabsRuntime.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
          cmd /c START-NEOLABS-SOC.cmd -ValidateOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
