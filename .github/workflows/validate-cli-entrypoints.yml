name: Validate NeoLabs CLI entrypoints

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-cli-entrypoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify clean-checkout CLI and Linux launcher contract
        run: |
          set -euo pipefail
          python3 -m tools.cli --help >/dev/null
          python3 tools/cli.py --help >/dev/null
          for file in \
            start-neolabs-soc.sh \
            internal/linux/Test-NeoLabsRuntime.sh \
            internal/linux/Repair-NeoLabsRuntime.sh \
            internal/common/Start-NeoLabsSOC.sh \
            wazuh-stack/scripts/ensure-prepared.sh \
            wazuh-stack/scripts/prepare-runtime-images.sh \
            wazuh-stack/scripts/start.sh; do
            bash -n "$file"
          done
          bash internal/linux/Test-NeoLabsRuntime.sh --validate-only
          bash internal/linux/Repair-NeoLabsRuntime.sh --validate-only
          bash start-neolabs-soc.sh --validate-only

          python3 - <<'PY'
          from pathlib import Path
          root = Path('start-neolabs-soc.sh').read_text(encoding='utf-8')
          common = Path('internal/common/Start-NeoLabsSOC.sh').read_text(encoding='utf-8')
          ensure = Path('wazuh-stack/scripts/ensure-prepared.sh').read_text(encoding='utf-8')

          if 'internal/common/Start-NeoLabsSOC.sh' not in root:
              raise SystemExit('Linux root must delegate to shared SOC orchestrator')
          if 'internal/linux/Test-NeoLabsRuntime.sh' not in root or 'internal/linux/Repair-NeoLabsRuntime.sh' not in root:
              raise SystemExit('Linux root must positively test then repair native runtime')
          for token in ('install_docker_ubuntu_debian()', 'ensure_docker_access()', 'start_docker_service()'):
              if token in root:
                  raise SystemExit('Linux root duplicated AutoFix ownership: ' + token)
          if 'WSL_DISTRO_NAME' not in root or 'native-Linux Docker installation is intentionally skipped' not in root:
              raise SystemExit('Linux root must retain Windows/WSL ownership guard')

          if 'python3 -m tools.cli login' not in common or 'python3 -m tools.cli connect' not in common:
              raise SystemExit('Shared orchestrator must use module CLI entrypoints')
          if common.index('ensure-prepared.sh') > common.index('python3 -m tools.cli login'):
              raise SystemExit('Preparation/image downloads must precede login')
          if common.index('python3 -m tools.cli login') > common.index('python3 -m tools.cli connect'):
              raise SystemExit('Login must precede connect')
          for cert in ('root-ca.pem','root-ca-manager.pem','admin-key.pem','wazuh.indexer-key.pem','wazuh.manager-key.pem','wazuh.dashboard-key.pem'):
              if cert not in ensure:
                  raise SystemExit('Central Wazuh preparation missing ' + cert)
          PY

  windows-cli-invocation-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows launcher convergence contract
        shell: powershell
        run: |
          $cmd = Get-Content .\START-NEOLABS-SOC.cmd -Raw
          $authority = Get-Content .\internal\windows\Ensure-NeoLabsRuntime.ps1 -Raw
          $soc = Get-Content .\internal\windows\Start-NeoLabsSOC.ps1 -Raw
          $common = Get-Content .\internal\common\Start-NeoLabsSOC.sh -Raw

          if ($cmd -notmatch 'Ensure-NeoLabsRuntime\.ps1') { throw 'Root CMD must invoke one Windows runtime authority.' }
          if ($cmd -notmatch 'Start-NeoLabsSOC\.ps1') { throw 'Root CMD must invoke Windows SOC adapter after runtime.' }
          foreach ($child in @('Repair-NeoLabsRuntime.ps1','Test-NeoLabsDockerRuntime.ps1','Recover-DockerDesktopBackend.ps1')) {
            if ($cmd -match [regex]::Escape($child)) { throw "Root CMD must not directly orchestrate $child" }
            if ($authority -notmatch [regex]::Escape($child)) { throw "Windows authority must own $child" }
          }
          if ($soc -notmatch 'internal/common/Start-NeoLabsSOC\.sh') { throw 'Windows SOC layer must delegate to shared orchestrator.' }
          if ($soc -match 'prepare-stack\.sh|Assert-DockerStillAvailable|verify-telemetry-pipeline\.sh') { throw 'Windows adapter must not duplicate shared runtime/Wazuh checks.' }
          if ($common -notmatch 'python3 -m tools\.cli connect') { throw 'Shared orchestrator must invoke tools.cli module.' }

      - name: Validate Windows PowerShell parsers and self-tests
        shell: powershell
        run: |
          foreach ($path in @(
            '.\internal\windows\Ensure-NeoLabsRuntime.ps1',
            '.\internal\windows\Test-NeoLabsDockerRuntime.ps1',
            '.\internal\windows\Repair-NeoLabsRuntime.ps1',
            '.\internal\windows\Recover-DockerDesktopBackend.ps1',
            '.\internal\windows\Start-NeoLabsSOC.ps1'
          )) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              foreach ($parseError in $errors) { Write-Error ("{0}:{1}:{2}: {3}" -f $path, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message) }
              exit 1
            }
          }
          cmd /c START-NEOLABS-SOC.cmd -ValidateOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
