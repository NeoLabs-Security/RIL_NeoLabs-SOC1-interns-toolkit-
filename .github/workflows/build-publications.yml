name: Build NeoLabs SOC Publications

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: write

jobs:
  publications:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libjpeg-turbo8 \
            libopenjp2-7
          python -m pip install --disable-pip-version-check \
            Markdown==3.6 \
            pydyf==0.10.0 \
            WeasyPrint==62.3

      - name: Validate publication script
        run: python -m py_compile scripts/build-publications.py

      - name: Build branded PDF set
        env:
          PUBLICATION_VERSION: week1-prod-${{ github.run_number }}
        run: python scripts/build-publications.py --output-dir publications

      - name: Verify generated publications
        run: |
          test -s publications/NeoLabs_SOC_L1_Analyst_Handbook.pdf
          test -s publications/NeoLabs_SOC_L1_Wazuh_Guide.pdf
          test -s publications/NeoLabs_SOC_L1_Investigation_Templates.pdf
          test -s publications/NeoLabs_SOC_L1_Lab_Pack.pdf
          test -s publications/NeoLabs_SOC_L1_Complete_Toolkit.pdf
          if find publications -maxdepth 1 -type f -name 'NeoLabs_SOC_L1_*.pdf' -size -10k -print -quit | grep -q .; then
            echo "One or more generated PDFs are unexpectedly small." >&2
            exit 1
          fi

      - name: Upload publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neolabs-soc-l1-publications
          path: publications/NeoLabs_SOC_L1_*.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit reference publications to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "neolabs-publications-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/NeoLabs_SOC_L1_Analyst_Handbook.pdf \
                  publications/NeoLabs_SOC_L1_Wazuh_Guide.pdf \
                  publications/NeoLabs_SOC_L1_Investigation_Templates.pdf \
                  publications/NeoLabs_SOC_L1_Lab_Pack.pdf \
                  publications/NeoLabs_SOC_L1_Complete_Toolkit.pdf
          if git diff --cached --quiet; then
            echo "Reference publications already current."
            exit 0
          fi
          git commit -m "Publish branded SOC L1 reference PDFs"
          git push
