name: Validate local telemetry launchers
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-analysis:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest tools.test_local_telemetry tools.test_local_launchers tools.test_local_import
