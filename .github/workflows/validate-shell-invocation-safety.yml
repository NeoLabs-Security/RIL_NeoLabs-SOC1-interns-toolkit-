name: Validate Shell Invocation Safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-invocation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Wazuh startup does not depend on helper executable bits
        run: |
          set -euo pipefail
          bash -n wazuh-stack/scripts/start.sh
          python3 - <<'PY'
          from pathlib import Path
          import re

          start = Path('wazuh-stack/scripts/start.sh').read_text(encoding='utf-8')
          required = (
              'bash ./scripts/ensure-prepared.sh',
              'bash ./scripts/preflight.sh',
              'bash ./scripts/repair-stale-bind-mounts.sh',
              'bash ./scripts/recover-runtime.sh',
              'bash ./scripts/health-check.sh --wait 600',
              'bash ./scripts/configure-index-retention.sh',
              'bash ./scripts/provision-dashboard-objects.sh',
              'bash ./scripts/disk-warning.sh',
          )
          missing = [item for item in required if item not in start]
          if missing:
              raise SystemExit('Wazuh startup must invoke shell helpers through bash: ' + ', '.join(missing))

          direct = []
          for number, line in enumerate(start.splitlines(), 1):
              stripped = line.strip()
              if re.match(r'^(?:if\s+!\s+)?\./scripts/[A-Za-z0-9_.-]+\.sh(?:\s|$)', stripped):
                  direct.append(f'{number}:{stripped}')
          if direct:
              raise SystemExit('Direct helper execution reintroduced executable-bit dependency: ' + '; '.join(direct))
          PY
