name: Validate Linux Docker runtime correlation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-docker-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse and validate Linux runtime helpers
        run: |
          set -euo pipefail
          bash -n start-neolabs-soc.sh
          bash -n internal/linux/Test-NeoLabsRuntime.sh
          bash -n internal/linux/Repair-NeoLabsRuntime.sh
          bash -n internal/common/Start-NeoLabsSOC.sh
          bash internal/linux/Test-NeoLabsRuntime.sh --validate-only
          bash internal/linux/Repair-NeoLabsRuntime.sh --validate-only
          bash start-neolabs-soc.sh --validate-only

      - name: Guard native runtime ownership and false-negative recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          launcher = Path('start-neolabs-soc.sh').read_text(encoding='utf-8')
          test = Path('internal/linux/Test-NeoLabsRuntime.sh').read_text(encoding='utf-8')
          repair = Path('internal/linux/Repair-NeoLabsRuntime.sh').read_text(encoding='utf-8')

          required_test = {
              'local socket': 'unix:///var/run/docker.sock' in test,
              'ignore stale context': 'env -u DOCKER_CONTEXT DOCKER_HOST="$LOCAL_DOCKER_HOST"' in test,
              'compose readiness': 'docker compose version' in test,
              'kernel readiness': 'vm.max_map_count' in test,
          }
          missing = [k for k,v in required_test.items() if not v]
          if missing: raise SystemExit('Linux runtime test incomplete: ' + ', '.join(missing))

          if 'internal/linux/Test-NeoLabsRuntime.sh' not in launcher or 'internal/linux/Repair-NeoLabsRuntime.sh' not in launcher:
              raise SystemExit('Linux root launcher must use positive readiness before AutoFix')
          if 'internal/common/Start-NeoLabsSOC.sh' not in launcher:
              raise SystemExit('Linux root launcher must delegate post-runtime SOC startup')
          for forbidden in ('install_docker_ubuntu_debian()', 'ensure_docker_access()', 'start_docker_service()'):
              if forbidden in launcher:
                  raise SystemExit('Root Linux launcher duplicated runtime installation: ' + forbidden)
          if 'NEOLABS_GROUP_REFRESHED' not in launcher or 'exec sg docker -c' not in launcher:
              raise SystemExit('Linux root launcher must refresh repaired docker-group membership without logout')

          required_repair = {
              'local user probe': 'docker_user_local_ostype' in repair,
              'local root probe': 'docker_root_local_ostype' in repair,
              'caller env diagnostics': '=== DOCKER ENVIRONMENT ===' in repair,
              'service restart': 'restart_docker_service' in repair,
              'package repair': 'upgrade_official_docker_packages' in repair,
              'timeout boundary probe': 'timeout boundary' in repair,
          }
          missing = [k for k,v in required_repair.items() if not v]
          if missing: raise SystemExit('Linux AutoFix incomplete: ' + ', '.join(missing))

          for text in (launcher, repair):
              for forbidden in ('docker system prune', 'rm -rf /var/lib/docker'):
                  if forbidden in text:
                      raise SystemExit('Linux runtime recovery must preserve Docker data: ' + forbidden)
          PY
