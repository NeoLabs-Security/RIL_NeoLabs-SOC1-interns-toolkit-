name: Validate SOC L1 Toolkit

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile and test Python
        run: |
          python -m compileall -q wazuh-stack/collector wazuh-stack/scripts scripts tools
          python -m unittest discover -s wazuh-stack/collector -p 'test_*.py' -v

      - name: Validate installed NeoLabs command
        run: |
          python -m pip install --disable-pip-version-check --no-deps -e .
          neolabs --help >/dev/null
          neolabs pod --help >/dev/null
          neolabs doctor --help >/dev/null

      - name: Validate shell syntax and Linux root launcher
        run: |
          bash -n start-neolabs-soc.sh
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find wazuh-stack/scripts wazuh-stack/tests -type f -name '*.sh' -print0)
          bash start-neolabs-soc.sh --validate-only

      - name: Validate clean root entrypoint layout
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [Path('START-NEOLABS-SOC.cmd'), Path('start-neolabs-soc.sh')]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit('Missing root SOC entrypoints: ' + ', '.join(missing))
          legacy = [
              'CHECK-NEOLABS-SOC.cmd', 'START-NEOLABS-DOCKER.cmd',
              'Start-NeoLabsDocker.ps1', 'Start-NeoLabsSOC.ps1',
              'setup-windows.cmd', 'neolabs.cmd', 'neolabs-local.cmd', 'neolabs.ps1',
          ]
          present = [p for p in legacy if Path(p).exists()]
          if present:
              raise SystemExit('Legacy helper files must not clutter repository root: ' + ', '.join(present))
          for path in ('internal/windows/Start-NeoLabsSOC.ps1','internal/windows/Start-NeoLabsDocker.ps1'):
              if not Path(path).is_file():
                  raise SystemExit(f'Missing internal Windows implementation file: {path}')
          PY

      - name: Validate telemetry-to-dashboard contract
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          rules = Path('wazuh-stack/config/rules/neolabs_vcc_rules.xml')
          root = ET.parse(rules).getroot()
          base = next((r for r in root.iter('rule') if r.attrib.get('id') == '100100'), None)
          if base is None:
              raise SystemExit('Missing NeoLabs base rule 100100')
          if int(base.attrib.get('level', '0')) < 3:
              raise SystemExit('Base VCC rule must create searchable wazuh-alerts-* documents for normal baseline telemetry')

          prepare = Path('wazuh-stack/scripts/prepare-stack.sh').read_text(encoding='utf-8')
          compose = Path('wazuh-stack/docker-compose.yml').read_text(encoding='utf-8')
          windows_launcher = Path('internal/windows/Start-NeoLabsSOC.ps1').read_text(encoding='utf-8')
          docker_bootstrap = Path('internal/windows/Start-NeoLabsDocker.ps1').read_text(encoding='utf-8')
          linux_launcher = Path('start-neolabs-soc.sh').read_text(encoding='utf-8')
          verifier = Path('wazuh-stack/scripts/verify-telemetry-pipeline.sh').read_text(encoding='utf-8')
          repair = Path('wazuh-stack/scripts/repair-telemetry-pipeline.sh').read_text(encoding='utf-8')
          doctor = Path('wazuh-stack/scripts/doctor.sh').read_text(encoding='utf-8')
          retention = Path('wazuh-stack/scripts/configure-index-retention.sh').read_text(encoding='utf-8')
          freshness = Path('wazuh-stack/scripts/telemetry-freshness.sh').read_text(encoding='utf-8')
          saved_template = Path('wazuh-stack/dashboard/neolabs-saved-objects.ndjson.template')

          required = {
              'manager JSON localfile input': '/var/ossec/logs/vcc/vcc-events.ndjson' in prepare,
              'shared telemetry volume': 'vcc_telemetry:/var/ossec/logs/vcc' in compose,
              'custom rule mount': 'neolabs_vcc_rules.xml:/var/ossec/etc/rules/neolabs_vcc_rules.xml:ro' in compose,
              'index verification': 'wazuh-alerts-*/_search' in verifier,
              'pod field verification': 'data.pod_id' in verifier,
              'rule-engine verification': 'wazuh-logtest' in verifier,
              'bounded local repair': 'replayed-objects.json' in repair,
              'Windows launcher invokes internal Docker bootstrap': 'Start-NeoLabsDocker.ps1' in windows_launcher,
              'Windows launcher installs WSL packages as root': 'apt-get install' in windows_launcher and 'wsl.exe -u root' in windows_launcher,
              'Windows launcher fixes indexer kernel setting': 'vm.max_map_count=262144' in windows_launcher,
              'Docker helper starts Desktop': 'desktop start' in docker_bootstrap or 'Start-Process -FilePath $desktopExe' in docker_bootstrap,
              'Docker helper checks WSL2': '--set-default-version 2' in docker_bootstrap and 'Get-DefaultWslDistribution' in docker_bootstrap,
              'Docker helper requires Linux engine': 'Get-DockerOsType' in docker_bootstrap and 'desktop engine use linux' in docker_bootstrap,
              'Docker helper verifies WSL integration': 'docker info --format' in docker_bootstrap and 'WSL Integration' in docker_bootstrap,
              'Docker helper detects Windows Server': 'Win32_OperatingSystem' in docker_bootstrap and 'IsWindowsServer' in docker_bootstrap,
              'Docker helper detects Windows VM VPS': 'Win32_ComputerSystem' in docker_bootstrap and 'IsVirtualMachine' in docker_bootstrap and 'Stop-UnsupportedWindowsPlatform' in docker_bootstrap,
              'Docker helper directs VPS to Linux launcher': 'bash start-neolabs-soc.sh' in docker_bootstrap and 'Ubuntu' in docker_bootstrap,
              'Linux launcher uses controlled sudo/root helper': 'run_root()' in linux_launcher and 'sudo' in linux_launcher,
              'Linux launcher installs official Docker packages': 'docker-ce' in linux_launcher and 'docker-compose-plugin' in linux_launcher,
              'Linux launcher fixes indexer kernel setting': 'vm.max_map_count=262144' in linux_launcher,
              'Windows launcher blocks on telemetry': 'verify-telemetry-pipeline.sh' in windows_launcher,
              'Linux launcher blocks on telemetry': 'verify-telemetry-pipeline.sh' in linux_launcher,
              'Windows launcher has repair fallback': 'repair-telemetry-pipeline.sh' in windows_launcher,
              'Linux launcher has repair fallback': 'repair-telemetry-pipeline.sh' in linux_launcher,
              'Windows launcher prints freshness': 'telemetry-freshness.sh' in windows_launcher,
              'Linux launcher prints freshness': 'telemetry-freshness.sh' in linux_launcher,
              'doctor checks Filebeat': 'filebeat test output' in doctor,
              'doctor checks dashboard': '7/7 Wazuh dashboard' in doctor,
              'retention is scoped': 'wazuh-alerts-*' in retention and "_ism/add/wazuh-alerts-*" in retention,
              'retention never uses broad add wildcard': "_ism/add/*'" not in retention and '_ism/add/*"' not in retention,
              'freshness checks assigned pod': 'data.pod_id' in freshness,
          }
          missing = [name for name, ok in required.items() if not ok]
          if missing:
              raise SystemExit('Telemetry/startup contract incomplete: ' + ', '.join(missing))

          expected = {
              'neolabs-vcc-alerts': 'index-pattern',
              'neolabs-night-watch-search': 'search',
              'neolabs-telemetry-health-search': 'search',
              'neolabs-night-watch': 'dashboard',
              'neolabs-telemetry-health': 'dashboard',
          }
          seen = {}
          for number, raw in enumerate(saved_template.read_text(encoding='utf-8').splitlines(), 1):
              if not raw.strip():
                  continue
              item = json.loads(raw.replace('__POD_ID__', 'pod-01'))
              seen[item.get('id')] = item.get('type')
              if not isinstance(item.get('references'), list):
                  raise SystemExit(f'Saved object line {number} has invalid references')
          if seen != expected:
              raise SystemExit(f'Unexpected saved object set: {seen!r}')
          night = json.loads(saved_template.read_text(encoding='utf-8').splitlines()[1].replace('__POD_ID__', 'pod-01'))
          columns = night['attributes']['columns']
          for field in ('data.pod_id','data.event_type','data.dstuser','data.source_ip','data.outcome','data.correlation_id','rule.level','data.event_time'):
              if field not in columns:
                  raise SystemExit(f'Night Watch saved view is missing {field}')
          health = json.loads(saved_template.read_text(encoding='utf-8').splitlines()[2].replace('__POD_ID__', 'pod-01'))
          if '100150' not in health['attributes']['kibanaSavedObjectMeta']['searchSourceJSON']:
              raise SystemExit('Telemetry Health saved search must target rule 100150')
          PY

      - name: Test Linux workstation compatibility profile
        env:
          SOC_HARD_MIN_MEMORY_GIB: "1"
          SOC_MIN_MEMORY_GIB: "1"
          SOC_RECOMMENDED_MEMORY_GIB: "1"
          SOC_MIN_DISK_GIB: "1"
        run: bash wazuh-stack/scripts/compatibility-check.sh

      - name: Rehearse Docker volume backup and restore
        run: bash wazuh-stack/tests/backup-restore-rehearsal.sh

      - name: Validate XML and NDJSON fixtures
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          rule_file = Path("wazuh-stack/config/rules/neolabs_vcc_rules.xml")
          ET.parse(rule_file)
          required = {"schema_version","event_id","event_time","pod_id","event_type","synthetic"}
          for path in Path("sample-logs").rglob("*.ndjson"):
              event_ids = set()
              for line_number, raw_line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if not raw_line.strip(): continue
                  event = json.loads(raw_line)
                  missing = required.difference(event)
                  if missing: raise SystemExit(f"{path}:{line_number}: missing {sorted(missing)}")
                  if event["synthetic"] is not True: raise SystemExit(f"{path}:{line_number}: event is not synthetic")
                  if event["event_id"] in event_ids: raise SystemExit(f"{path}:{line_number}: duplicate event_id")
                  event_ids.add(event["event_id"])
              if not event_ids: raise SystemExit(f"{path}: fixture is empty")
          PY

      - name: Validate Docker Compose structure
        run: |
          cp wazuh-stack/.env.example wazuh-stack/.env
          chmod 600 wazuh-stack/.env
          sed -i 's/CHANGE_ME_GENERATE_STRONG_SECRET/0123456789abcdef0123456789abcdef0123456789abcdef/g' wazuh-stack/.env
          COMPOSE_PROJECT_NAME=neolabs-soc1-wazuh docker compose --env-file wazuh-stack/.env -f wazuh-stack/docker-compose.yml config --quiet
          rm -f wazuh-stack/.env

      - name: Validate publication source set
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          script = Path("scripts/build-publications.py")
          ast.parse(script.read_text(encoding="utf-8"), filename=str(script))
          required = [
              "docs/secops-foundations/05-windows-and-sysmon-investigation.md",
              "docs/secops-foundations/06-linux-web-and-cloud-log-investigation.md",
              "docs/secops-foundations/07-wazuh-alert-investigation-and-tuning.md",
              "docs/secops-foundations/08-case-management-reporting-and-capstone.md",
              "docs/setup/WORKSTATION_COMPATIBILITY.md",
              "docs/setup/BACKUP_AND_RECOVERY.md",
              "docs/brand/print.css",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing: raise SystemExit("Missing publication inputs:\n" + "\n".join(missing))
          PY

      - name: Check repository safety boundaries
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          forbidden_suffixes = {".key", ".p12", ".pfx"}
          forbidden_names = {".env", "client.crt", "ca.crt", "enrolment.json", "assigned-pod"}
          forbidden_directories = {"backups", "secrets", "dist"}
          tracked = subprocess.check_output(["git", "ls-files", "-z"])
          violations = []
          for raw_path in tracked.split(b"\0"):
              if not raw_path: continue
              path = Path(raw_path.decode("utf-8"))
              if path.name in forbidden_names or path.suffix.lower() in forbidden_suffixes or any(part in forbidden_directories for part in path.parts):
                  violations.append(str(path))
          if violations: raise SystemExit("Forbidden credential, backup or generated files committed:\n" + "\n".join(violations))
          PY

  windows-launcher-contract:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate one-click Windows root launcher contract
        shell: cmd
        run: START-NEOLABS-SOC.cmd -ValidateOnly

      - name: Validate internal Windows PowerShell syntax
        shell: powershell
        run: |
          foreach ($path in '.\internal\windows\Start-NeoLabsDocker.ps1', '.\internal\windows\Start-NeoLabsSOC.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }

      - name: Validate Windows platform guard contract
        shell: powershell
        run: |
          $text = Get-Content .\internal\windows\Start-NeoLabsDocker.ps1 -Raw
          foreach ($required in @('Win32_OperatingSystem','Win32_ComputerSystem','IsWindowsServer','IsVirtualMachine','Stop-UnsupportedWindowsPlatform','bash start-neolabs-soc.sh')) {
            if ($text -notmatch [regex]::Escape($required)) { throw "Windows platform guard is missing: $required" }
          }

      - name: Validate root CMD routes to internal implementation
        shell: powershell
        run: |
          $text = Get-Content .\START-NEOLABS-SOC.cmd -Raw
          if ($text -notmatch 'internal\\windows\\Start-NeoLabsSOC.ps1') { throw 'Root CMD does not route to the internal Windows launcher' }
          if (-not (Test-Path .\start-neolabs-soc.sh)) { throw 'Linux root launcher is missing' }
