name: Validate SOC L1 Toolkit

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile and test Python
        run: |
          python -m compileall -q wazuh-stack/collector wazuh-stack/scripts scripts tools
          python -m unittest discover -s wazuh-stack/collector -p 'test_*.py' -v
          python wazuh-stack/scripts/validate-local-rules.py

      - name: Validate installed NeoLabs command
        run: |
          python -m pip install --disable-pip-version-check --no-deps -e .
          neolabs --help >/dev/null
          neolabs pod --help >/dev/null
          neolabs doctor --help >/dev/null

      - name: Validate shell syntax and Linux root launcher
        run: |
          set -euo pipefail
          bash -n neolabs
          bash -n start-neolabs-soc.sh
          bash -n internal/linux/Test-NeoLabsRuntime.sh
          bash -n internal/linux/Repair-NeoLabsRuntime.sh
          bash -n internal/common/Start-NeoLabsSOC.sh
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find wazuh-stack/scripts wazuh-stack/tests -type f -name '*.sh' -print0)
          bash neolabs --help >/dev/null
          bash start-neolabs-soc.sh --validate-only

      - name: Validate clean root entrypoint layout
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'START-NEOLABS-SOC.cmd', 'start-neolabs-soc.sh',
              'neolabs.cmd', 'neolabs',
              'internal/common/Start-NeoLabsSOC.sh',
              'internal/linux/Test-NeoLabsRuntime.sh',
              'internal/linux/Repair-NeoLabsRuntime.sh',
              'internal/windows/Ensure-NeoLabsRuntime.ps1',
              'internal/windows/Test-NeoLabsDockerRuntime.ps1',
              'internal/windows/Repair-NeoLabsRuntime.ps1',
              'internal/windows/Recover-DockerDesktopBackend.ps1',
              'internal/windows/Start-NeoLabsSOC.ps1',
              'internal/windows/Invoke-NeoLabsCLI.ps1',
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing: raise SystemExit('Missing launcher/CLI components: ' + ', '.join(missing))
          legacy = ['CHECK-NEOLABS-SOC.cmd','START-NEOLABS-DOCKER.cmd','Start-NeoLabsDocker.ps1','Start-NeoLabsSOC.ps1','setup-windows.cmd','neolabs-local.cmd','neolabs.ps1']
          present = [p for p in legacy if Path(p).exists()]
          if present: raise SystemExit('Legacy helpers must not clutter repository root: ' + ', '.join(present))

          linux_cli = Path('neolabs').read_text(encoding='utf-8')
          windows_cli = Path('neolabs.cmd').read_text(encoding='utf-8')
          windows_cli_adapter = Path('internal/windows/Invoke-NeoLabsCLI.ps1').read_text(encoding='utf-8')
          if 'python3 -m tools.cli' not in linux_cli or 'cd "$ROOT_DIR"' not in linux_cli:
              raise SystemExit('Linux root NeoLabs CLI must run tools.cli from repository root')
          if 'Invoke-NeoLabsCLI.ps1' not in windows_cli or 'python3 -m tools.cli' not in windows_cli_adapter:
              raise SystemExit('Windows root NeoLabs CLI must delegate to the WSL2 module adapter')
          PY

      - name: Validate telemetry-to-dashboard and startup contract
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          rules = Path('wazuh-stack/config/rules/neolabs_vcc_rules.xml')
          root = ET.parse(rules).getroot()
          base = next((r for r in root.iter('rule') if r.attrib.get('id') == '100100'), None)
          if base is None or int(base.attrib.get('level','0')) < 3:
              raise SystemExit('NeoLabs base rule 100100 must create searchable baseline alerts')

          prepare = Path('wazuh-stack/scripts/prepare-stack.sh').read_text(encoding='utf-8')
          ensure = Path('wazuh-stack/scripts/ensure-prepared.sh').read_text(encoding='utf-8')
          images = Path('wazuh-stack/scripts/prepare-runtime-images.sh').read_text(encoding='utf-8')
          compose = Path('wazuh-stack/docker-compose.yml').read_text(encoding='utf-8')
          common = Path('internal/common/Start-NeoLabsSOC.sh').read_text(encoding='utf-8')
          linux_root = Path('start-neolabs-soc.sh').read_text(encoding='utf-8')
          windows_cmd = Path('START-NEOLABS-SOC.cmd').read_text(encoding='utf-8')
          windows_authority = Path('internal/windows/Ensure-NeoLabsRuntime.ps1').read_text(encoding='utf-8')
          windows_repair = Path('internal/windows/Repair-NeoLabsRuntime.ps1').read_text(encoding='utf-8')
          windows_soc = Path('internal/windows/Start-NeoLabsSOC.ps1').read_text(encoding='utf-8')
          verifier = Path('wazuh-stack/scripts/verify-telemetry-pipeline.sh').read_text(encoding='utf-8')
          telemetry_repair = Path('wazuh-stack/scripts/repair-telemetry-pipeline.sh').read_text(encoding='utf-8')
          doctor = Path('wazuh-stack/scripts/doctor.sh').read_text(encoding='utf-8')
          retention = Path('wazuh-stack/scripts/configure-index-retention.sh').read_text(encoding='utf-8')
          freshness = Path('wazuh-stack/scripts/telemetry-freshness.sh').read_text(encoding='utf-8')

          required = {
              'manager JSON localfile input': '/var/ossec/logs/vcc/vcc-events.ndjson' in prepare,
              'shared telemetry volume': 'vcc_telemetry:/var/ossec/logs/vcc' in compose,
              'custom rule mount': 'neolabs_vcc_rules.xml:/var/ossec/etc/rules/neolabs_vcc_rules.xml:ro' in compose,
              'index verification': 'wazuh-alerts-*/_search' in verifier and 'data.pod_id' in verifier,
              'bounded telemetry repair': 'replayed-objects.json' in telemetry_repair,
              'central Wazuh prep': 'repair-certificate-permissions.sh' in ensure and 'prepare-runtime-images.sh' in ensure,
              'pre-auth image preload': all(x in images for x in ('wazuh-indexer','wazuh-manager','wazuh-dashboard','vcc.telemetry.collector')),
              'common login/connect': 'python3 -m tools.cli login' in common and 'python3 -m tools.cli connect' in common,
              'common telemetry proof': 'verify-telemetry-pipeline.sh' in common and 'repair-telemetry-pipeline.sh' in common,
              'common freshness': 'telemetry-freshness.sh' in common,
              'Linux single AutoFix': 'internal/linux/Test-NeoLabsRuntime.sh' in linux_root and 'internal/linux/Repair-NeoLabsRuntime.sh' in linux_root and 'internal/common/Start-NeoLabsSOC.sh' in linux_root,
              'Windows single authority': 'Ensure-NeoLabsRuntime.ps1' in windows_cmd and 'Repair-NeoLabsRuntime.ps1' in windows_authority and 'Recover-DockerDesktopBackend.ps1' in windows_authority,
              'Windows physical guard': 'Assert-PhysicalWindowsWorkstation' in windows_repair,
              'Windows Docker floor': "MinimumDockerDesktopVersion = [version]'4.83.0'" in windows_repair,
              'Windows WSL integration repair': 'Set-DockerWslIntegration' in windows_repair,
              'Windows shared SOC adapter': 'internal/common/Start-NeoLabsSOC.sh' in windows_soc,
              'doctor checks Filebeat': 'filebeat test output' in doctor,
              'doctor checks dashboard': '7/7 Wazuh dashboard' in doctor,
              'retention is scoped': 'wazuh-alerts-*' in retention and "_ism/add/wazuh-alerts-*" in retention,
              'freshness checks assigned pod': 'data.pod_id' in freshness,
          }
          missing = [name for name, ok in required.items() if not ok]
          if missing: raise SystemExit('Telemetry/startup contract incomplete: ' + ', '.join(missing))

          if not (common.index('ensure-prepared.sh') < common.index('python3 -m tools.cli login') < common.index('python3 -m tools.cli connect')):
              raise SystemExit('Shared startup ordering must be prepare/download -> login -> connect')
          for duplicate in ('install_docker_ubuntu_debian()', 'ensure_docker_access()', 'start_docker_service()'):
              if duplicate in linux_root: raise SystemExit('Linux root duplicates AutoFix: ' + duplicate)
          for child in ('Repair-NeoLabsRuntime.ps1','Test-NeoLabsDockerRuntime.ps1','Recover-DockerDesktopBackend.ps1'):
              if child in windows_cmd: raise SystemExit('Windows CMD bypasses runtime authority: ' + child)

          saved_template = Path('wazuh-stack/dashboard/neolabs-saved-objects.ndjson.template')
          expected = {'neolabs-vcc-alerts':'index-pattern','neolabs-night-watch-search':'search','neolabs-telemetry-health-search':'search','neolabs-night-watch':'dashboard','neolabs-telemetry-health':'dashboard'}
          seen = {}
          for raw in saved_template.read_text(encoding='utf-8').splitlines():
              if not raw.strip(): continue
              item = json.loads(raw.replace('__POD_ID__','pod-01'))
              seen[item.get('id')] = item.get('type')
          if seen != expected: raise SystemExit(f'Unexpected saved object set: {seen!r}')
          PY

      - name: Test Linux workstation compatibility profile
        env:
          SOC_HARD_MIN_MEMORY_GIB: "1"
          SOC_MIN_MEMORY_GIB: "1"
          SOC_RECOMMENDED_MEMORY_GIB: "1"
          SOC_MIN_DISK_GIB: "1"
        run: bash wazuh-stack/scripts/compatibility-check.sh

      - name: Rehearse Docker volume backup and restore
        run: bash wazuh-stack/tests/backup-restore-rehearsal.sh

      - name: Validate XML and NDJSON fixtures
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse('wazuh-stack/config/rules/neolabs_vcc_rules.xml')
          required = {'schema_version','event_id','event_time','pod_id','event_type','synthetic'}
          for path in Path('sample-logs').rglob('*.ndjson'):
              ids=set()
              for n, raw in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if not raw.strip(): continue
                  event=json.loads(raw); missing=required.difference(event)
                  if missing: raise SystemExit(f'{path}:{n}: missing {sorted(missing)}')
                  if event['synthetic'] is not True: raise SystemExit(f'{path}:{n}: event is not synthetic')
                  if event['event_id'] in ids: raise SystemExit(f'{path}:{n}: duplicate event_id')
                  ids.add(event['event_id'])
              if not ids: raise SystemExit(f'{path}: fixture is empty')
          PY

      - name: Validate Docker Compose structure
        run: |
          cp wazuh-stack/.env.example wazuh-stack/.env
          chmod 600 wazuh-stack/.env
          sed -i 's/CHANGE_ME_GENERATE_STRONG_SECRET/0123456789abcdef0123456789abcdef0123456789abcdef/g' wazuh-stack/.env
          docker compose --env-file wazuh-stack/.env -f wazuh-stack/docker-compose.yml config --quiet
          rm -f wazuh-stack/.env

      - name: Validate publication source set
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('scripts/build-publications.py').read_text(encoding='utf-8'))
          required=['docs/secops-foundations/05-windows-and-sysmon-investigation.md','docs/secops-foundations/06-linux-web-and-cloud-log-investigation.md','docs/secops-foundations/07-wazuh-alert-investigation-and-tuning.md','docs/secops-foundations/08-case-management-reporting-and-capstone.md','docs/setup/WORKSTATION_COMPATIBILITY.md','docs/setup/BACKUP_AND_RECOVERY.md','docs/brand/print.css']
          missing=[p for p in required if not Path(p).is_file()]
          if missing: raise SystemExit('Missing publication inputs: ' + ', '.join(missing))
          PY

      - name: Check repository safety boundaries
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          forbidden_suffixes={'.key','.p12','.pfx'}; forbidden_names={'.env','client.crt','ca.crt','enrolment.json','assigned-pod'}; forbidden_dirs={'backups','secrets','dist'}
          violations=[]
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw: continue
              p=Path(raw.decode())
              if p.name in forbidden_names or p.suffix.lower() in forbidden_suffixes or any(part in forbidden_dirs for part in p.parts): violations.append(str(p))
          if violations: raise SystemExit('Forbidden generated/credential files committed: ' + ', '.join(violations))
          PY

  windows-launcher-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate one-click Windows root launcher contract
        shell: cmd
        run: START-NEOLABS-SOC.cmd -ValidateOnly

      - name: Validate internal Windows PowerShell syntax
        shell: powershell
        run: |
          foreach ($path in @('.\internal\windows\Ensure-NeoLabsRuntime.ps1','.\internal\windows\Test-NeoLabsDockerRuntime.ps1','.\internal\windows\Repair-NeoLabsRuntime.ps1','.\internal\windows\Recover-DockerDesktopBackend.ps1','.\internal\windows\Start-NeoLabsDocker.ps1','.\internal\windows\Start-NeoLabsSOC.ps1','.\internal\windows\Invoke-NeoLabsCLI.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }

      - name: Validate Windows platform and authority guard contract
        shell: powershell
        run: |
          $repair = Get-Content .\internal\windows\Repair-NeoLabsRuntime.ps1 -Raw
          $authority = Get-Content .\internal\windows\Ensure-NeoLabsRuntime.ps1 -Raw
          foreach ($required in @('Win32_OperatingSystem','Win32_ComputerSystem','Assert-PhysicalWindowsWorkstation','MinimumDockerDesktopVersion','Set-DockerWslIntegration')) {
            if ($repair -notmatch [regex]::Escape($required)) { throw "Windows AutoFix/platform guard missing: $required" }
          }
          foreach ($required in @('Test-NeoLabsDockerRuntime.ps1','Repair-NeoLabsRuntime.ps1','Recover-DockerDesktopBackend.ps1','Ensure-WslSocPrerequisites')) {
            if ($authority -notmatch [regex]::Escape($required)) { throw "Windows runtime authority missing: $required" }
          }

      - name: Validate root CMD routes one authority before SOC adapter
        shell: powershell
        run: |
          $text=Get-Content .\START-NEOLABS-SOC.cmd -Raw
          $runtime=$text.IndexOf('Ensure-NeoLabsRuntime.ps1'); $soc=$text.IndexOf('Start-NeoLabsSOC.ps1')
          if ($runtime -lt 0 -or $soc -lt 0 -or $runtime -gt $soc) { throw 'Root CMD must route runtime authority before SOC adapter' }
          foreach ($child in @('Repair-NeoLabsRuntime.ps1','Test-NeoLabsDockerRuntime.ps1','Recover-DockerDesktopBackend.ps1')) { if ($text -match [regex]::Escape($child)) { throw "Root CMD must not directly call $child" } }

      - name: Validate root Windows NeoLabs CLI wrapper
        shell: powershell
        run: |
          $cmd=Get-Content .\neolabs.cmd -Raw
          $adapter=Get-Content .\internal\windows\Invoke-NeoLabsCLI.ps1 -Raw
          if ($cmd -notmatch 'Invoke-NeoLabsCLI\.ps1') { throw 'neolabs.cmd must delegate to the Windows CLI adapter' }
          if ($adapter -notmatch 'python3 -m tools\.cli') { throw 'Windows CLI adapter must invoke tools.cli as a module' }
