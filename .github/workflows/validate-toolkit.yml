name: Validate SOC L1 Toolkit

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile and test Python
        run: |
          python -m compileall -q wazuh-stack/collector wazuh-stack/scripts scripts tools
          python -m unittest discover -s wazuh-stack/collector -p 'test_*.py' -v

      - name: Validate installed NeoLabs command
        run: |
          python -m pip install --disable-pip-version-check --no-deps -e .
          neolabs --help >/dev/null
          neolabs pod --help >/dev/null

      - name: Validate shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find wazuh-stack/scripts wazuh-stack/tests -type f -name '*.sh' -print0)

      - name: Validate telemetry-to-dashboard contract
        run: |
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          rules = Path('wazuh-stack/config/rules/neolabs_vcc_rules.xml')
          root = ET.parse(rules).getroot()
          base = next((r for r in root.iter('rule') if r.attrib.get('id') == '100100'), None)
          if base is None:
              raise SystemExit('Missing NeoLabs base rule 100100')
          if int(base.attrib.get('level', '0')) < 3:
              raise SystemExit('Base VCC rule must create searchable wazuh-alerts-* documents for normal baseline telemetry')

          prepare = Path('wazuh-stack/scripts/prepare-stack.sh').read_text(encoding='utf-8')
          compose = Path('wazuh-stack/docker-compose.yml').read_text(encoding='utf-8')
          launcher = Path('Start-NeoLabsSOC.ps1').read_text(encoding='utf-8')
          verifier = Path('wazuh-stack/scripts/verify-telemetry-pipeline.sh').read_text(encoding='utf-8')
          repair = Path('wazuh-stack/scripts/repair-telemetry-pipeline.sh').read_text(encoding='utf-8')

          required = {
              'manager JSON localfile input': '/var/ossec/logs/vcc/vcc-events.ndjson' in prepare,
              'shared telemetry volume': 'vcc_telemetry:/var/ossec/logs/vcc' in compose,
              'custom rule mount': 'neolabs_vcc_rules.xml:/var/ossec/etc/rules/neolabs_vcc_rules.xml:ro' in compose,
              'index verification': 'wazuh-alerts-*/_search' in verifier,
              'pod field verification': 'data.pod_id' in verifier,
              'rule-engine verification': 'wazuh-logtest' in verifier,
              'bounded local repair': 'replayed-objects.json' in repair,
              'launcher blocks on telemetry': 'verify-telemetry-pipeline.sh' in launcher,
              'launcher has repair fallback': 'repair-telemetry-pipeline.sh' in launcher,
          }
          missing = [name for name, ok in required.items() if not ok]
          if missing:
              raise SystemExit('Telemetry contract incomplete: ' + ', '.join(missing))
          PY

      - name: Test Linux workstation compatibility profile
        env:
          SOC_MIN_MEMORY_GIB: "1"
          SOC_RECOMMENDED_MEMORY_GIB: "1"
          SOC_MIN_DISK_GIB: "1"
        run: bash wazuh-stack/scripts/compatibility-check.sh

      - name: Rehearse Docker volume backup and restore
        run: bash wazuh-stack/tests/backup-restore-rehearsal.sh

      - name: Validate XML and NDJSON fixtures
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          rule_file = Path("wazuh-stack/config/rules/neolabs_vcc_rules.xml")
          ET.parse(rule_file)

          required = {
              "schema_version",
              "event_id",
              "event_time",
              "pod_id",
              "event_type",
              "synthetic",
          }
          for path in Path("sample-logs").rglob("*.ndjson"):
              event_ids = set()
              for line_number, raw_line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if not raw_line.strip():
                      continue
                  event = json.loads(raw_line)
                  missing = required.difference(event)
                  if missing:
                      raise SystemExit(f"{path}:{line_number}: missing {sorted(missing)}")
                  if event["synthetic"] is not True:
                      raise SystemExit(f"{path}:{line_number}: event is not synthetic")
                  if event["event_id"] in event_ids:
                      raise SystemExit(f"{path}:{line_number}: duplicate event_id")
                  event_ids.add(event["event_id"])
              if not event_ids:
                  raise SystemExit(f"{path}: fixture is empty")
          PY

      - name: Validate Docker Compose structure
        run: |
          cp wazuh-stack/.env.example wazuh-stack/.env
          chmod 600 wazuh-stack/.env
          sed -i 's/CHANGE_ME_GENERATE_STRONG_SECRET/0123456789abcdef0123456789abcdef0123456789abcdef/g' wazuh-stack/.env
          COMPOSE_PROJECT_NAME=neolabs-soc1-wazuh \
            docker compose --env-file wazuh-stack/.env -f wazuh-stack/docker-compose.yml config --quiet
          rm -f wazuh-stack/.env

      - name: Validate publication source set
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          script = Path("scripts/build-publications.py")
          ast.parse(script.read_text(encoding="utf-8"), filename=str(script))
          required = [
              "docs/secops-foundations/05-windows-and-sysmon-investigation.md",
              "docs/secops-foundations/06-linux-web-and-cloud-log-investigation.md",
              "docs/secops-foundations/07-wazuh-alert-investigation-and-tuning.md",
              "docs/secops-foundations/08-case-management-reporting-and-capstone.md",
              "docs/setup/WORKSTATION_COMPATIBILITY.md",
              "docs/setup/BACKUP_AND_RECOVERY.md",
              "docs/brand/print.css",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit("Missing publication inputs:\n" + "\n".join(missing))
          PY

      - name: Check repository safety boundaries
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          forbidden_suffixes = {".key", ".p12", ".pfx"}
          forbidden_names = {".env", "client.crt", "ca.crt", "enrolment.json", "assigned-pod"}
          forbidden_directories = {"backups", "secrets", "dist"}
          tracked = subprocess.check_output(["git", "ls-files", "-z"])
          violations = []
          for raw_path in tracked.split(b"\0"):
              if not raw_path:
                  continue
              path = Path(raw_path.decode("utf-8"))
              if (
                  path.name in forbidden_names
                  or path.suffix.lower() in forbidden_suffixes
                  or any(part in forbidden_directories for part in path.parts)
              ):
                  violations.append(str(path))
          if violations:
              raise SystemExit("Forbidden credential, backup or generated files committed:\n" + "\n".join(violations))
          PY

  windows-launcher-contract:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate one-click Windows launcher contract
        shell: cmd
        run: START-NEOLABS-SOC.cmd -ValidateOnly
