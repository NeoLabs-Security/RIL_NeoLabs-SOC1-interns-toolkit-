# NeoLabs wrapper for the official Wazuh 4.14.7 single-node topology.
# Upstream configuration is generated locally by scripts/prepare-stack.sh.
services:
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - vcc_telemetry:/var/ossec/logs/vcc
      - ./generated/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./generated/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./generated/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./generated/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./config/rules/neolabs_vcc_rules.xml:/var/ossec/etc/rules/neolabs_vcc_rules.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-analysisd is running' && /var/ossec/bin/wazuh-control status | grep -q 'wazuh-apid is running'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - wazuh_internal
      # Wazuh's vulnerability/content updater requires DNS/HTTPS egress. Keep the
      # indexer isolated and give only the manager a separate outbound bridge.
      - manager_egress

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION}
    hostname: wazuh.indexer
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./generated/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./generated/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./generated/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./generated/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./generated/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./generated/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./generated/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -skf -u admin:${WAZUH_INDEXER_PASSWORD} https://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - wazuh_internal

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION}
    hostname: wazuh.dashboard
    restart: unless-stopped
    ports:
      - "${WAZUH_DASHBOARD_BIND}:${WAZUH_DASHBOARD_PORT}:5601"
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD}
    volumes:
      - ./generated/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./generated/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./generated/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./generated/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./generated/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_healthy
    healthcheck:
      # /status is protected by OpenSearch Dashboards security in Wazuh 4.14.7.
      # Probe it with the already-present indexer credential rather than treating
      # the expected unauthenticated HTTP 401 as an unhealthy dashboard.
      test: ["CMD-SHELL", "curl -skf -u \"$${INDEXER_USERNAME}:$${INDEXER_PASSWORD}\" https://localhost:5601/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - wazuh_internal
      - dashboard_access

  vcc.telemetry.collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    image: neolabs/vcc-telemetry-collector:0.1.0
    hostname: vcc.telemetry.collector
    restart: unless-stopped
    environment:
      VCC_TELEMETRY_ENDPOINT: ${VCC_TELEMETRY_ENDPOINT:-}
      VCC_CLIENT_CERT_PATH: /run/vcc-secrets/client.crt
      VCC_CLIENT_KEY_PATH: /run/vcc-secrets/client.key
      VCC_CA_CERT_PATH: /run/vcc-secrets/ca.crt
      VCC_INSTALLATION_ID_PATH: /run/vcc-secrets/installation-id
      VCC_TELEMETRY_CURSOR_PATH: /state/vcc-telemetry.cursor
      VCC_OUTPUT_PATH: /data/vcc-events.ndjson
      VCC_HEALTH_PATH: /state/collector-health.json
      VCC_POLL_INTERVAL_SECONDS: ${VCC_POLL_INTERVAL_SECONDS:-15}
    volumes:
      - vcc_telemetry:/data
      - ./state:/state
      # Host enrolment secrets stay 0700/0600. A bounded staging helper copies
      # only the required files into this collector-owned read-only runtime volume.
      - vcc_runtime_secrets:/run/vcc-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "python /app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    networks:
      - vcc_egress

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  vcc_telemetry:
  # Created by scripts/stage-vcc-secrets.sh before Compose starts the collector.
  # Marking it external prevents a normal Compose teardown from deleting mTLS state.
  vcc_runtime_secrets:
    name: ${COMPOSE_PROJECT_NAME}_vcc_runtime_secrets
    external: true

networks:
  # Manager/indexer traffic remains isolated. Dashboard and manager receive
  # separate bridges only for the specific host-access/egress capabilities needed.
  wazuh_internal:
    internal: true
  dashboard_access:
  manager_egress:
  vcc_egress:
